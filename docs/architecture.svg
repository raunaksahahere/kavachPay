<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-label="Kavach Pay architecture" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- regions -->
  <rect x="170" y="14" width="540" height="232" rx="10" fill="#eef7f6" stroke="#0d9488" stroke-width="1.2"/>
  <text x="182" y="32" font-size="11" font-weight="700" fill="#0f766e">DETERMINISTIC CORE — owns every decision and every database write</text>

  <rect x="170" y="318" width="540" height="124" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="182" y="433" font-size="11" font-weight="700" fill="#b45309">GEMINI API — untrusted input, can only add risk</text>

  <!-- clients -->
  <g>
    <rect x="10" y="50" width="130" height="72" rx="8" fill="#ffffff" stroke="#0f2a4a" stroke-width="1.3"/>
    <text x="75" y="74" font-size="12" font-weight="700" fill="#0f2a4a" text-anchor="middle">User app</text>
    <text x="75" y="91" font-size="9.5" fill="#334155" text-anchor="middle">Send · Collect inbox</text>
    <text x="75" y="105" font-size="9.5" fill="#334155" text-anchor="middle">Check a message</text>
  </g>
  <g>
    <rect x="10" y="346" width="130" height="72" rx="8" fill="#ffffff" stroke="#0f2a4a" stroke-width="1.3"/>
    <text x="75" y="370" font-size="12" font-weight="700" fill="#0f2a4a" text-anchor="middle">Analyst dashboard</text>
    <text x="75" y="387" font-size="9.5" fill="#334155" text-anchor="middle">Flagged · Mule graph</text>
    <text x="75" y="401" font-size="9.5" fill="#334155" text-anchor="middle">Audit verify · Eval</text>
  </g>

  <!-- core row 1 -->
  <g>
    <rect x="190" y="50" width="140" height="72" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
    <text x="260" y="72" font-size="12" font-weight="700" fill="#0f2a4a" text-anchor="middle">API route handlers</text>
    <text x="260" y="89" font-size="9.5" fill="#334155" text-anchor="middle">Zod validation · rate limit</text>
    <text x="260" y="103" font-size="9.5" fill="#334155" text-anchor="middle">idempotency key · PIN check</text>
  </g>
  <g>
    <rect x="370" y="50" width="150" height="72" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
    <text x="445" y="72" font-size="12" font-weight="700" fill="#0f2a4a" text-anchor="middle">Risk engine</text>
    <text x="445" y="89" font-size="9.5" fill="#334155" text-anchor="middle">Rules R1–R7 + capped R8</text>
    <text x="445" y="103" font-size="9.5" fill="#334155" text-anchor="middle">score 0–100 with reasons</text>
  </g>
  <g>
    <rect x="560" y="50" width="140" height="72" rx="8" fill="#0f2a4a" stroke="#0f2a4a" stroke-width="1.3"/>
    <text x="630" y="72" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Decision</text>
    <text x="630" y="89" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Allow &lt; 30 · Warn 30–69</text>
    <text x="630" y="103" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Hold 70+</text>
  </g>

  <!-- core row 2 -->
  <g>
    <rect x="190" y="160" width="140" height="68" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
    <text x="260" y="182" font-size="12" font-weight="700" fill="#0f2a4a" text-anchor="middle">Audit log</text>
    <text x="260" y="199" font-size="9.5" fill="#334155" text-anchor="middle">append-only hash chain</text>
    <text x="260" y="213" font-size="9.5" fill="#334155" text-anchor="middle">verifiable on demand</text>
  </g>
  <g>
    <rect x="370" y="160" width="150" height="68" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
    <text x="445" y="182" font-size="12" font-weight="700" fill="#0f2a4a" text-anchor="middle">Postgres</text>
    <text x="445" y="199" font-size="9.5" fill="#334155" text-anchor="middle">row locks · constraints</text>
    <text x="445" y="213" font-size="9.5" fill="#334155" text-anchor="middle">balance can never go negative</text>
  </g>
  <g>
    <rect x="560" y="160" width="140" height="68" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
    <text x="630" y="182" font-size="12" font-weight="700" fill="#0f2a4a" text-anchor="middle">Ledger</text>
    <text x="630" y="199" font-size="9.5" fill="#334155" text-anchor="middle">double entry · state machine</text>
    <text x="630" y="213" font-size="9.5" fill="#334155" text-anchor="middle">entries sum to zero</text>
  </g>

  <!-- core arrows -->
  <line x1="140" y1="86" x2="188" y2="86" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="330" y1="86" x2="368" y2="86" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="520" y1="86" x2="558" y2="86" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="630" y1="122" x2="630" y2="158" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="560" y1="194" x2="522" y2="194" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="330" y1="194" x2="368" y2="194" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="290" y1="122" x2="290" y2="158" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <!-- dashboard to API -->
  <path d="M75 346 V140 H230 V124" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- validation gate -->
  <rect x="190" y="268" width="510" height="30" rx="6" fill="#0f766e"/>
  <text x="445" y="287" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">VALIDATION GATE · Zod schema · clamp · R8 cap +25 · grounding check · 4 s timeout</text>

  <!-- gemini boxes -->
  <g>
    <rect x="190" y="350" width="140" height="64" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
    <text x="260" y="371" font-size="11.5" font-weight="700" fill="#7c2d12" text-anchor="middle">G1 Scam analyzer</text>
    <text x="260" y="387" font-size="9.5" fill="#334155" text-anchor="middle">text + screenshot</text>
    <text x="260" y="401" font-size="9.5" fill="#334155" text-anchor="middle">→ structured signals</text>
  </g>
  <g>
    <rect x="370" y="350" width="150" height="64" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
    <text x="445" y="371" font-size="11.5" font-weight="700" fill="#7c2d12" text-anchor="middle">G2 Explainer</text>
    <text x="445" y="387" font-size="9.5" fill="#334155" text-anchor="middle">rule facts → warning in</text>
    <text x="445" y="401" font-size="9.5" fill="#334155" text-anchor="middle">English · Hindi · Bengali</text>
  </g>
  <g>
    <rect x="560" y="350" width="140" height="64" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
    <text x="630" y="371" font-size="11.5" font-weight="700" fill="#7c2d12" text-anchor="middle">G3 Analyst copilot</text>
    <text x="630" y="387" font-size="9.5" fill="#334155" text-anchor="middle">read-only tools only</text>
    <text x="630" y="401" font-size="9.5" fill="#334155" text-anchor="middle">max 6 steps</text>
  </g>

  <!-- gemini arrows -->
  <line x1="260" y1="350" x2="260" y2="300" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrA)"/>
  <line x1="445" y1="350" x2="445" y2="300" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrA)"/>
  <line x1="630" y1="350" x2="630" y2="300" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrA)"/>

  <!-- gate to risk engine -->
  <path d="M540 268 V140 H500 V124" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="547" y="262" font-size="9.5" font-weight="600" fill="#0f766e">signals only</text>
</svg>
