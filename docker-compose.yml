# Local Postgres for automated tests (and optional offline development).
# The app itself can point DATABASE_URL at Neon or at this container.
services:
  postgres:
    image: postgres:17-alpine
    container_name: kavach-postgres
    environment:
      POSTGRES_USER: kavach
      POSTGRES_PASSWORD: kavach
      POSTGRES_DB: kavach_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kavach -d kavach_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
