<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f2a4a" />
    <title>Kavach Pay — offline</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f8; color: #0f1b2d;
        font-family: Inter, "Noto Sans", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #5b6779; line-height: 1.5; margin: 0 0 20px; }
      button { background: #0f2a4a; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Kavach Pay needs a connection to check payments safely. No payment is made while you are offline.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
